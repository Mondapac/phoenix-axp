# Phoenix settings over the image's flowable-default.properties (slice 2.1). Environment
# variables override every line here.

# Flowable owns its own database and upgrades its own tables (PoC 3, R9). The datasource URL,
# user and password come from the environment; the entrypoint refuses to start without them.
flowable.database-schema-update=true
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=10

# Timers and async jobs. Escalation latency = this wait + the core's sync interval (PoC 3, R6).
# 10 s is Flowable's default, set here on purpose; development and CI use 1 s.
flowable.async-executor-activate=true
flowable.process.async.executor.default-timer-job-acquire-wait-time=10s
flowable.process.async.executor.default-async-job-acquire-wait-time=10s
flowable.history-level=full

# No demo processes, no API browser, only the health endpoint of Spring's management API.
flowable.rest.app.create-demo-definitions=false
flowable.rest.app.swagger-docs-enabled=false
management.endpoints.web.exposure.include=health

# Process variables are JSON or plain values; Java-serialised objects are refused.
rest.variables.allow.serializable=false
