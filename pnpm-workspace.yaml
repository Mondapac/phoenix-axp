packages:
  - apps/*
  - packages/*

# Dependency build scripts are denied by default (supply-chain hygiene, ADR-0014 decision 2 and
# ADR-0009 decision 4). List a package under onlyBuiltDependencies only after reviewing why it
# needs an install script.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver
  # Install-time analytics of swagger-ui-dist; not wanted.
  - '@scarf/scarf'

# Reviewed exceptions: Prisma downloads its schema engine (used by migrations) at install.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

# Security overrides for transitive dependencies of the Prisma CLI (development tooling).
# Remove each line once Prisma depends on a patched version itself.
overrides:
  mysql2@<3.23.1: ^3.23.1
  deepmerge-ts@<8.0.0: ^8.0.0
