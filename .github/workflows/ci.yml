name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (tenants ${{ matrix.tenants.name }}, Node ${{ matrix.node.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Tenant matrix (ADR-0002): each entry is one deployment's HOSTED_TENANTS, booted and
        # probed below. Every entry names tenants that have a file in config/tenants/. The test
        # suites always run against both fixtures, whatever the entry.
        tenants:
          - name: demo-fa
            hosted: demo-fa
          - name: demo-en
            hosted: demo-en
        # The exact minimum of `engines.node` in package.json, and the version in .nvmrc.
        # Raise both together.
        node:
          - label: minimum
            version: 24.20.0
          - label: .nvmrc
            version-file: .nvmrc

    services:
      # Same image and major version as docker-compose.yml. Pulled from Google's mirror of the
      # official image: Docker Hub rate-limits anonymous pulls from CI runners.
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d phoenix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Job level holds only what the application may see. MIGRATION_DATABASE_URL is set on the
    # steps that need it, never here, so the boot probes run without it.
    env:
      DATABASE_URL: postgresql://phoenix_api:phoenix_api@localhost:5432/phoenix
      HOSTED_TENANTS: ${{ matrix.tenants.hosted }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # A service container cannot mount a repository file, so the bootstrap runs here. The
      # second run is the existing-volume path: the files must converge, not fail. The second
      # file creates Flowable's own database and login (slice 2.1).
      - name: Create database roles (cluster bootstrap)
        run: |
          for run in 1 2; do
            for file in scripts/db/bootstrap-dev.sql scripts/db/bootstrap-flowable-dev.sql; do
              docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d phoenix < "$file"
            done
          done

      # Phoenix's Flowable image (infra/flowable/), built from the same digest as on Docker Hub
      # through Google's mirror, and started now so it boots while dependencies install. Host
      # network: it reaches the PostgreSQL service on localhost. Timers every second, as in
      # docker-compose.yml.
      - name: Build and start Flowable (process engine)
        run: |
          docker build --build-arg BASE_IMAGE=mirror.gcr.io/flowable/flowable-rest:7.1.0@sha256:b7ae287502cd5c243b577a0ca2894172e1c18cd75aea4fd67dc7d58f1b40db44 \
            -t phoenix/flowable-rest:ci infra/flowable
          # Refuses to start without its own PostgreSQL database.
          if docker run --rm phoenix/flowable-rest:ci; then
            echo "The Flowable image started without a database" >&2
            exit 1
          fi
          docker run -d --name flowable --network host \
            -e SERVER_PORT=8090 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/flowable \
            -e SPRING_DATASOURCE_USERNAME=flowable \
            -e SPRING_DATASOURCE_PASSWORD=flowable \
            -e FLOWABLE_REST_APP_ADMIN_USERID=rest-admin \
            -e FLOWABLE_REST_APP_ADMIN_PASSWORD=phoenix-ci-flowable \
            -e FLOWABLE_PROCESS_ASYNC_EXECUTOR_DEFAULTTIMERJOBACQUIREWAITTIME=1s \
            -e FLOWABLE_PROCESS_ASYNC_EXECUTOR_DEFAULTASYNCJOBACQUIREWAITTIME=1s \
            phoenix/flowable-rest:ci

      # SeaweedFS for the object storage tests (ADR-0012). A service container cannot take a
      # command or mount a repository file, so it starts here, with the same image, flags and
      # identities file as docker-compose.yml.
      - name: Start SeaweedFS (object storage)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            mirror.gcr.io/chrislusf/seaweedfs:3.80 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64 -dir=/data

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # One of the two is set per matrix entry; node-version wins when both are set.
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Show the Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # The S3 gateway answers once the filer is up; an unsigned request then gets 403.
      - name: Wait for SeaweedFS
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8333/ || true)
            if [ "$code" = 403 ]; then exit 0; fi
            sleep 2
          done
          docker logs seaweedfs >&2
          echo "SeaweedFS did not become ready" >&2
          exit 1

      # The image's own health check (/management/engine), then the probe: no demo processes,
      # no management endpoint but health, a timer fires and the history carries the tenant.
      # Then the database split of PoC 3 (R9): Flowable's tables live in its own database only,
      # and neither login can connect to the other's database.
      - name: Check Flowable (health, timer, own database)
        env:
          FLOWABLE_PASSWORD: phoenix-ci-flowable
        run: |
          for attempt in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' flowable)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ] || [ "$attempt" = 90 ]; then
              docker logs flowable >&2
              echo "Flowable did not become healthy ($status)" >&2
              exit 1
            fi
            sleep 2
          done
          node scripts/check-flowable.mjs http://localhost:8090/flowable-rest
          pg="${{ job.services.postgres.id }}"
          tables() { docker exec "$pg" psql -U postgres -d "$1" -Atc "SELECT count(*) FROM pg_tables WHERE tablename LIKE 'act\_%' AND tableowner = 'flowable'"; }
          [ "$(tables flowable)" -gt 0 ] || { echo "No Flowable tables in its database" >&2; exit 1; }
          [ "$(tables phoenix)" = 0 ] || { echo "Flowable tables in the core database" >&2; exit 1; }
          refused() {
            # Refused for the privilege, not for a wrong password or a missing database.
            out=$(docker exec -e PGPASSWORD="$2" "$pg" psql -h 127.0.0.1 -U "$1" -d "$3" -c 'SELECT 1' 2>&1 || true)
            if ! printf '%s' "$out" | grep -q 'does not have CONNECT privilege'; then
              echo "$1 on the database $3: $out" >&2
              exit 1
            fi
            echo "ok   $1 cannot connect to $3"
          }
          refused flowable flowable phoenix
          refused phoenix_api phoenix_api flowable
          refused phoenix_migrator phoenix_migrator flowable

      # Typecheck, lint, boundaries, licences, tests, database tests and the up -> down -> up
      # migration check: the same command developers run locally.
      - name: Verify
        run: pnpm verify
        env:
          MIGRATION_DATABASE_URL: postgresql://phoenix_migrator:phoenix_migrator@localhost:5432/phoenix
          # Fewer database spec files at once than Jest's default on the small CI runners.
          TEST_DB_MAX_WORKERS: '2'
          # For pnpm test:storage only; the boot probes below run without object storage.
          S3_ENDPOINT: http://localhost:8333
          S3_ACCESS_KEY_ID: phoenix
          S3_SECRET_ACCESS_KEY: phoenix-dev-secret

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://phoenix_migrator:phoenix_migrator@localhost:5432/phoenix

      # Job environment only: this process has no migration URL, and its start-up self-check
      # refuses any role but the application login.
      - name: Boot the API for these tenants, probe readiness and the security headers
        run: |
          APP_ROLE=api PORT=3000 node apps/api/dist/main &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health/ready; then
              node scripts/check-http-headers.mjs http://localhost:3000
              exit $?
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1

      # The worker role opens no port and exits 0 on SIGTERM (main.ts handles the signal
      # itself; exit 143 would mean no handler ran).
      - name: Boot the worker role, check it opens no port and stops on SIGTERM
        run: |
          APP_ROLE=worker PORT=3100 node apps/api/dist/main &
          worker=$!
          sleep 8
          kill -0 "$worker" || { echo "Worker exited early" >&2; exit 1; }
          if ss -ltnp | grep -q "pid=$worker,"; then
            echo "Worker opened a listening port" >&2
            ss -ltnp | grep "pid=$worker," >&2
            exit 1
          fi
          kill -TERM "$worker"
          wait "$worker" || { echo "Worker did not stop cleanly on SIGTERM" >&2; exit 1; }
