; PoC 1 (slice 0.6): PgBouncer in transaction-pooling mode in front of the spike cluster.
; Test-only values. Start: pgbouncer -d pgbouncer.ini (as a non-root user).
[databases]
phoenix_poc = host=127.0.0.1 port=5433 dbname=phoenix_poc
phoenix_poc_norls = host=127.0.0.1 port=5433 dbname=phoenix_poc_norls

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6433
unix_socket_dir =
auth_type = scram-sha-256
auth_file = userlist.txt
pool_mode = transaction
; Few server connections for many clients, so units of different tenants share them.
default_pool_size = 8
max_client_conn = 1000
; Protocol-level named prepared statements are tracked in transaction mode (1.21+). The
; application uses unnamed statements only, so this is belt and braces.
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
logfile = pgbouncer.log
pidfile = pgbouncer.pid
admin_users = pgbadmin
